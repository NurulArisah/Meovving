<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - Meowing</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    .font-anton { font-family: 'Anton', sans-serif; }
    .font-poppins { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-black text-white font-poppins min-h-screen flex flex-col relative">

  <div class="absolute top-6 left-6 z-10">
      <a href="login.html" class="text-gray-400 hover:text-white text-2xl transition">
        &#8592; </a>
  </div>

  <div class="w-full max-w-sm mx-auto min-h-screen flex flex-col justify-center px-6">
    
    <div id="stepEmail" class="flex flex-col animate-fade-in">
        <h1 class="text-3xl font-anton text-[#CC361E] text-center mb-10 tracking-wider">MEOWING</h1>
        
        <h2 class="text-xl font-semibold mb-2">Forgot Password?</h2>
        <p class="text-gray-400 text-sm mb-8">Enter your email address to reset your password.</p>

        <div class="space-y-6">
            <input type="email" id="emailInput" placeholder="Enter your email" 
                class="w-full bg-[#333] text-white px-4 py-3 rounded-2xl focus:outline-none focus:ring-2 focus:ring-[#CC361E] placeholder-gray-500 transition">
            
            <button onclick="handleSendEmail()" class="w-full bg-[#CC361E] py-3 rounded-2xl font-semibold hover:bg-red-700 transition shadow-lg shadow-red-900/20">
                Sent Me Email
            </button>
        </div>
    </div>


    <div id="stepReset" class="hidden flex-col animate-fade-in">
        <h2 class="text-2xl font-semibold mb-6 text-center">Create New Password</h2>

        <div class="bg-[#333] rounded-2xl px-4 py-3 mb-6 opacity-70">
            <input type="email" id="displayEmail" disabled class="w-full bg-transparent text-gray-400 cursor-not-allowed outline-none">
        </div>

        <p class="text-[11px] text-gray-400 mb-4 px-1">
            Create a strong password to keep your account safe and secure
        </p>

        <div class="space-y-4">
            <div class="bg-[#333] rounded-2xl px-4 py-3 flex items-center justify-between">
                <input type="password" id="newPass" class="w-full bg-transparent focus:outline-none text-white placeholder-gray-500" placeholder="New password">
                <span class="text-gray-500 cursor-pointer hover:text-white">👁</span>
            </div>

            <div class="bg-[#333] rounded-2xl px-4 py-3 flex items-center justify-between">
                <input type="password" id="confirmPass" class="w-full bg-transparent focus:outline-none text-white placeholder-gray-500" placeholder="Confirm Password">
                <span class="text-gray-500 cursor-pointer hover:text-white">👁</span>
            </div>
        </div>

        <button onclick="handleChangePassword()" class="w-full bg-[#CC361E] py-3 rounded-2xl font-semibold mt-10 hover:bg-red-700 transition shadow-lg shadow-red-900/20">
           Change Password
        </button>
    </div>

  </div>

  <script src="Javascript/forgot-password.js"></script>
</body>
</html>
