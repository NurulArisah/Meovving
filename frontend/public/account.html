<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account - Meovving</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Anton+SC&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    .font-anton { font-family: 'Anton SC', sans-serif; }
    .font-poppins { font-family: 'Poppins', sans-serif; }
    /* Style untuk input OTP agar hanya garis bawah */
    .otp-input {
      background: transparent;
      border-bottom: 2px solid #4B5563;
      text-align: center;
      color: white;
      font-size: 1.5rem;
      width: 3rem;
      margin: 0 0.5rem;
    }
    .otp-input:focus { outline: none; border-color: #CC361E; }
  </style>
</head>
<body class="bg-black text-white font-poppins min-h-screen">

  <div class="max-w-md mx-auto min-h-screen relative flex flex-col px-6 pt-8 pb-6">
    
    <div class="flex justify-between items-center mb-8 relative">
        <h1 id="brandLogo" class="text-xl text-[#CC361E] font-anton tracking-wider">MEOWING</h1>
        
        <button id="backBtn" onclick="handleBack()" class="text-white text-2xl hover:text-gray-300 z-10">✕</button>
    </div>

    <div class="mb-8">
        <h2 id="pageTitle" class="text-2xl font-semibold text-center">Account</h2>
    </div>


    <div id="sectionMain" class="flex-grow flex flex-col transition-opacity duration-300">
      
      <div class="mb-8">
        <p class="text-lg font-medium">Membership</p>
        <p class="text-xs text-gray-500">Valid until <span id="validDate">Loading...</span></p>
        <div class="w-full border-t border-gray-800 mt-4"></div>
      </div>

      <div class="space-y-6">
        
        <div onclick="goTo('password')" class="cursor-pointer group">
          <div class="flex justify-between items-center">
             <span class="text-lg">Password</span>
             <span class="text-gray-500 group-hover:text-white transition">›</span>
          </div>
          <div class="w-full border-t border-gray-800 mt-4"></div>
        </div>

        <div onclick="goTo('email')" class="cursor-pointer group">
          <div class="flex justify-between items-center mb-1">
             <span class="text-lg">Email</span>
             <span class="text-gray-500 group-hover:text-white transition">›</span>
          </div>
          <p class="text-xs text-gray-500" id="currentEmailDisplay">user@example.com</p>
          <div class="w-full border-t border-gray-800 mt-4"></div>
        </div>

      </div>
    </div>


    <div id="sectionPassword" class="hidden flex-grow flex flex-col">
      <div class="space-y-6">
        
        <div class="bg-[#333] rounded-xl px-4 py-3">
            <label class="text-gray-400 text-xs block mb-1">Current Password</label>
            <input type="password" id="oldPass" class="w-full bg-transparent focus:outline-none text-white placeholder-gray-500" placeholder="••••••">
        </div>
        <div class="text-right">
            <a href="#" class="text-xs text-gray-500 hover:text-white">Forgot Password?</a>
        </div>

        <p class="text-xs text-gray-400 px-1">Create a strong password to keep your account safe and secure</p>

        <div class="bg-[#555] rounded-xl px-4 py-3 flex items-center justify-between">
            <input type="password" id="newPass" class="w-full bg-transparent focus:outline-none text-white placeholder-gray-300" placeholder="New password">
            <span class="text-gray-400 cursor-pointer">👁</span>
        </div>

        <div class="bg-[#555] rounded-xl px-4 py-3 flex items-center justify-between">
            <input type="password" id="confirmPass" class="w-full bg-transparent focus:outline-none text-white placeholder-gray-300" placeholder="Confirm Password">
            <span class="text-gray-400 cursor-pointer">👁</span>
        </div>

      </div>

      <div class="mt-auto pt-10">
         <button onclick="savePassword()" class="w-full bg-[#CC361E] py-3 rounded-xl font-semibold shadow-lg shadow-red-900/20 active:scale-95 transition-transform">
           Change Password
         </button>
      </div>
    </div>


    <div id="sectionEmail" class="hidden flex-grow flex flex-col">
       <div class="space-y-6 mt-10">
          <div class="bg-[#555] rounded-xl px-4 py-3">
             <input type="email" id="newEmailInput" class="w-full bg-transparent focus:outline-none text-white placeholder-gray-300" placeholder="New Email">
          </div>
       </div>

       <div class="mt-8">
          <button onclick="goTo('otp')" class="w-full bg-[#CC361E] py-3 rounded-xl font-semibold shadow-lg shadow-red-900/20 active:scale-95 transition-transform">
            Next
          </button>
       </div>
    </div>


    <div id="sectionOTP" class="hidden flex-grow flex flex-col text-center mt-10">
        <p class="text-sm text-gray-300 mb-1">The OTP verification code has been</p>
        <p class="text-sm text-gray-300 mb-2">sent via email</p>
        <p class="text-sm text-gray-500 mb-10" id="otpEmailTarget">user@mail.com</p>

        <div class="flex justify-center mb-10 gap-2">
            <input type="text" maxlength="1" class="otp-input" onkeyup="moveFocus(this, 'otp2')">
            <input type="text" maxlength="1" class="otp-input" id="otp2" onkeyup="moveFocus(this, 'otp3')">
            <input type="text" maxlength="1" class="otp-input" id="otp3" onkeyup="moveFocus(this, 'otp4')">
            <input type="text" maxlength="1" class="otp-input" id="otp4">
        </div>

        <button onclick="saveEmail()" class="w-full bg-[#CC361E] py-3 rounded-xl font-semibold shadow-lg shadow-red-900/20 active:scale-95 transition-transform">
            Save
        </button>
    </div>

  </div>

  <script src="../Javascript/account.js"></script>
</body>
</html>
