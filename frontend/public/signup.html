<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account - Meovving</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton+SC&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    .font-anton { font-family: 'Anton SC', sans-serif; }
  </style>
</head>

<body class="relative bg-black text-white min-h-screen flex flex-col items-center justify-center font-[Poppins]">

  <div class="w-full max-w-xs px-4 pb-20">
    
    <h1 class="text-4xl font-anton text-[#CC361E] mb-6 text-left">MEOWING</h1>

    <form id="signup-form" class="flex flex-col space-y-5" onsubmit="daftarUser(event)">
      
      <input type="text" id="username" placeholder="Username" required
        class="bg-[#4C4F54] text-[#FFFFFF] px-4 py-2 rounded-[16px] text-sm focus:outline-none focus:ring-2" />
      
      <input type="email" id="email" placeholder="Email" required
        class="bg-[#4C4F54] text-[#FFFFFF] px-4 py-2 rounded-[16px] text-sm focus:outline-none focus:ring-2" />
      
      <input type="password" id="password" placeholder="Password" required
        class="bg-[#4C4F54] text-[#FFFFFF] px-4 py-2 rounded-[16px] text-sm focus:outline-none focus:ring-2" />
      
      <input type="password" id="confirm-password" placeholder="Confirm Password" required
        class="bg-[#4C4F54] text-[#FFFFFF] px-4 py-2 rounded-[16px] text-sm focus:outline-none focus:ring-2" />

      <div class="flex items-center justify-center my-2">
        <div class="w-20 border-t border-[#565353]"></div>
        <span class="mx-3 text-[#565353] text-[10px]">OR</span>
        <div class="w-20 border-t border-[#565353]"></div>
      </div>

      <div class="flex justify-center mb-2">
        <button type="button" onclick="handleGoogleLogin()" class="bg-[#4C4F54] py-[7px] px-[12px] rounded-[16px] hover:bg-[#3A3A3A] transition">
          <img src="../assets/icons/google.svg" alt="Google" class="w-6 h-6" />
        </button>
      </div>

      <button
        type="submit"
        class="bg-[#CC361E] hover:bg-red-700 text-white font-semibold py-2 w-full rounded-[16px] transition mt-5">
        Sign Up
      </button>
    </form>

    <div class="absolute bottom-11 left-0 right-0 text-center text-sm text-gray-300">
      Already have an account?
      <a href="login.html" class="text-[#E63946] hover:underline">Log In</a>
    </div>

  </div> 

  <script src="../Javascript/signup.js"></script>
</body>
</html>
