<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Meovving</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton+SC&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    .font-anton { font-family: 'Anton SC', sans-serif; }
    
    /* Hilangkan scrollbar tapi tetap bisa di-scroll (Horizontal) */
    .scrollbar-hide::-webkit-scrollbar {
        display: none;
    }
    .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
  </style>
</head>

<body class="bg-black text-white min-h-screen font-[Poppins] pb-20">

  <nav class="flex items-center justify-between px-6 py-6 sticky top-0 z-50 bg-black/90 backdrop-blur-sm">
    <h1 class="text-3xl font-anton text-[#CC361E] tracking-wide">MEOWING</h1>
    
    <div class="flex items-center gap-5">
      <button class="hover:text-[#CC361E] transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </button>
      
      <button class="hover:text-[#CC361E] transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
  </nav>

  <div id="mainContent" class="flex flex-col gap-8">
    <div class="px-6 text-gray-500">Loading content...</div>
  </div>

  <script src="../javascript/dashboard.js"></script>

</body>
</html>
