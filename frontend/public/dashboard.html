<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Meowing</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Anton+SC&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: '#CC361E', dark: '#0a0a0a', card: '#1a1a1a' },
          fontFamily: { anton: ['Anton', 'sans-serif'], logo: ['"Anton SC"', 'sans-serif'], poppins: ['Poppins', 'sans-serif'] },
          animation: { 'slide-up': 'slideUp 0.3s ease-out forwards', 'fade-in': 'fadeIn 0.5s ease-out forwards' },
          keyframes: {
            slideUp: { '0%': { transform: 'translateY(100%)' }, '100%': { transform: 'translateY(0)' } },
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } }
          }
        }
      }
    }
  </script>

  <style>
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .mask-gradient { mask-image: linear-gradient(to bottom, black 50%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%); }
    
    /* STYLE ANGKA (JANGAN DIUBAH) */
    .text-outline-shadow {
        color: #000000;
        text-shadow: 2px 0px 0 #CC361E, -2px 0px 0 #CC361E, 0px 2px 0 #CC361E, 0px -2px 0 #CC361E, 1px 1px 0 #CC361E, -1px -1px 0 #CC361E, 1px -1px 0 #CC361E, -1px 1px 0 #CC361E;
    }

    /* Style Filter Button (Active State) */
    .filter-btn.active { background-color: #CC361E; color: white; border-color: #CC361E; }
  </style>
</head>

<body class="bg-black text-white min-h-screen font-poppins pb-20 overflow-x-hidden">

  <nav class="flex items-center justify-between px-6 py-5 sticky top-0 z-40 bg-black/90 backdrop-blur-sm border-b border-gray-800/50">
    <h1 onclick="resetDashboard()" class="text-3xl font-logo text-brand tracking-wide cursor-pointer hover:scale-105 transition-transform">MEOWING</h1>
    
    <div class="flex items-center gap-4">
      <button onclick="openSearchOverlay()" class="text-white hover:text-brand transition p-2">
          <i class="fas fa-search text-xl"></i>
      </button>

      <button onclick="toggleSidebar()" class="text-white hover:text-brand transition">
        <i class="fas fa-bars text-2xl"></i>
      </button>
    </div>
  </nav>

  <div id="mainContent" class="flex flex-col gap-8 mt-2 min-h-[500px]">
    <div class="px-6 text-gray-500 animate-pulse">Loading content...</div>
  </div>

  <div id="searchOverlay" class="fixed inset-0 bg-black z-[60] hidden flex-col p-6 overflow-y-auto animate-fade-in">
    
    <div class="flex items-center gap-3 mb-8">
        <div class="flex-1 bg-[#1a1a1a] rounded-xl flex items-center px-4 py-3 border border-gray-800 focus-within:border-gray-500 transition">
            <i class="fas fa-search text-gray-400"></i>
            <input type="text" id="overlaySearchInput" placeholder="Search..." class="bg-transparent border-none outline-none text-white ml-3 w-full placeholder-gray-500" oninput="handleOverlayInput(this.value)">
        </div>
        
        <button onclick="toggleFilterSection()" class="bg-[#1a1a1a] rounded-xl w-12 h-12 flex items-center justify-center border border-gray-800 hover:border-brand transition">
            <i class="fas fa-sliders-h text-white"></i> </button>

        <button onclick="closeSearchOverlay()" class="text-white font-medium ml-2">Cancel</button>
    </div>

    <div id="popularSearchSection" class="block">
        <h3 class="text-brand font-bold text-lg mb-4">Popular Searching</h3>
        <ul id="popularList" class="space-y-4">
            </ul>
    </div>

    <div id="filterSection" class="hidden mb-8">
        <div class="mb-6">
            <h3 class="text-brand font-bold text-lg mb-3">Genre</h3>
            <div class="flex flex-wrap gap-3">
                <button class="filter-btn px-6 py-2 rounded-full bg-[#222] text-gray-300 text-sm font-medium border border-transparent hover:border-gray-500 transition">Action</button>
                <button class="filter-btn px-6 py-2 rounded-full bg-[#222] text-gray-300 text-sm font-medium border border-transparent hover:border-gray-500 transition">Horror</button>
                <button class="filter-btn px-6 py-2 rounded-full bg-[#222] text-gray-300 text-sm font-medium border border-transparent hover:border-gray-500 transition">Comedy</button>
                <button class="filter-btn px-6 py-2 rounded-full bg-[#222] text-gray-300 text-sm font-medium border border-transparent hover:border-gray-500 transition">Thriller</button>
                <button class="filter-btn px-6 py-2 rounded-full bg-[#222] text-gray-300 text-sm font-medium border border-transparent hover:border-gray-500 transition">Romance</button>
            </div>
        </div>

        <div>
            <h3 class="text-brand font-bold text-lg mb-3">Rating</h3>
            <div class="flex flex-wrap gap-3">
                <button class="filter-btn px-6 py-2 rounded-full bg-[#222] text-gray-300 text-sm font-medium border border-transparent hover:border-gray-500 transition">5 - 3.5</button>
                <button class="filter-btn px-6 py-2 rounded-full bg-[#222] text-gray-300 text-sm font-medium border border-transparent hover:border-gray-500 transition">3.5 - 2</button>
                <button class="filter-btn px-6 py-2 rounded-full bg-[#222] text-gray-300 text-sm font-medium border border-transparent hover:border-gray-500 transition">2 - 0</button>
            </div>
        </div>
        
        <button onclick="applyFilter()" class="w-full bg-brand text-white font-bold py-3 rounded-xl mt-8 shadow-lg shadow-red-900/20">Apply Filter</button>
    </div>

    <div id="overlaySearchResults" class="hidden grid grid-cols-2 gap-4">
        </div>

  </div>

  <div id="sidebar" class="fixed inset-y-0 right-0 w-full md:w-80 bg-dark z-[70] transform translate-x-full transition-transform duration-300 ease-in-out p-6 shadow-2xl flex flex-col">
      <div class="flex flex-row-reverse justify-between items-center mb-10">
          <button onclick="toggleSidebar()" class="text-white text-3xl hover:text-brand transition"><i class="fas fa-times"></i></button>
          <span class="text-xl font-bold text-gray-400">Menu</span>
      </div>
      <ul class="space-y-6 text-lg font-medium">
          <li class="flex justify-between items-center cursor-pointer hover:text-brand transition group"><span class="flex items-center gap-4"><i class="far fa-user w-6 text-center"></i> Profile</span></li>
          <li class="flex justify-between items-center cursor-pointer hover:text-brand transition group"><span class="flex items-center gap-4"><i class="fas fa-cog w-6 text-center"></i> Account</span></li>
          <li onclick="window.location.href='whos-watching.html'" class="flex justify-between items-center cursor-pointer hover:text-brand transition group"><span class="flex items-center gap-4"><i class="fas fa-users w-6 text-center"></i> Switch Profile</span></li>
          <li onclick="alert('Logged Out!')" class="flex justify-between items-center cursor-pointer hover:text-brand transition group mt-auto text-red-500"><span class="flex items-center gap-4"><i class="fas fa-sign-out-alt w-6 text-center"></i> Log Out</span></li>
      </ul>
  </div>

  <div id="movieModal" onclick="closeModal(event)" class="fixed inset-0 bg-black/90 z-[100] hidden justify-center items-end opacity-0 transition-opacity duration-300 backdrop-blur-sm">
      <div class="bg-[#111] w-full max-w-lg rounded-t-3xl overflow-hidden relative animate-slide-up pb-8 shadow-2xl border-t border-gray-800">
          <div class="relative w-full h-[400px]">
              <img src="" id="modalImage" class="w-full h-full object-cover mask-gradient">
              <button onclick="closeModalDirect()" class="absolute top-5 right-5 bg-black/50 text-white w-10 h-10 flex items-center justify-center rounded-full backdrop-blur-md hover:bg-brand transition z-20"><i class="fas fa-times"></i></button>
          </div>
          <div class="px-6 -mt-20 relative z-10">
              <h2 id="modalTitle" class="text-4xl font-bold mb-2 leading-tight text-white drop-shadow-lg font-logo">Title</h2>
              <div class="flex items-center text-gray-300 text-sm mb-6 space-x-3 font-medium">
                  <div class="flex items-center gap-1 text-white bg-yellow-600/20 px-2 py-0.5 rounded border border-yellow-600/50"><i class="fas fa-star text-yellow-500 text-xs"></i><span id="modalRating">0.0</span></div>
                  <span>2024</span> • <span>Action</span>
              </div>
              <div class="flex space-x-3">
                  <button class="flex-1 bg-[#222] text-white py-3.5 rounded-lg font-semibold flex justify-center items-center gap-2 hover:bg-[#333] transition border border-gray-700"><i class="fas fa-plus"></i> Watchlist</button>
                  <button class="flex-1 bg-brand text-white py-3.5 rounded-lg font-semibold flex justify-center items-center gap-2 hover:bg-red-700 transition shadow-lg shadow-red-900/20">Details</button>
              </div>
          </div>
      </div>
  </div>

  <script src="../javascript/dashboard.js"></script>

</body>
</html>
